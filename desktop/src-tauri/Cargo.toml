[package]
name = "zak-desktop"
version = "0.1.0"
description = "Desktop app for the zak agent kit CLI and delegation config"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "zak_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "zak-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
