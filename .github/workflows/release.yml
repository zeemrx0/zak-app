name: Release zak CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
      - run: npm ci
      - run: npm test
      - name: Validate identity and tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const r = require('./src/release/release-metadata');
          if (process.env.TAG !== 'v' + p.version ||
              process.env.GITHUB_REPOSITORY !== r.releaseRepository(p) ||
              !(r.STABLE.test(p.version) || r.BETA.test(p.version)))
            process.exit(1);
          NODE
      - name: Build configured CLI
        env:
          ZAK_PUBLIC_REPO: ${{ vars.ZAK_PUBLIC_REPO }}
        run: npm run build
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          prerelease=''
          latest='--latest'
          case "$TAG" in
            *-beta.*) prerelease='--prerelease'; latest='--latest=false';;
          esac
          gh release create "$TAG" --verify-tag --draft $prerelease $latest \
            --title "$TAG" --notes 'Verified zak CLI release.'
          gh release upload "$TAG" dist/release/install.sh \
            dist/release/zak-cli-*.tgz dist/release/SHA256SUMS
          mkdir read-back
          gh release download "$TAG" --dir read-back
          cmp dist/release/install.sh read-back/install.sh
          cmp dist/release/SHA256SUMS read-back/SHA256SUMS
          (cd read-back && sha256sum -c SHA256SUMS)
  desktop:
    needs: release
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
      - name: Read version
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match package.json $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-apple-darwin
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install tauri-cli
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
      - name: Test desktop app
        working-directory: desktop/src-tauri
        run: |
          set -eu
          cargo test
          cargo clippy --all-targets -- -D warnings
      - name: Build desktop bundle
        working-directory: desktop/src-tauri
        run: cargo tauri build --target aarch64-apple-darwin --bundles app,dmg --config "{\"version\":\"$VERSION\"}"
      - name: Package and verify
        run: |
          set -eu
          bundle=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p dist/desktop
          ditto -c -k --keepParent "$bundle/macos/zAgentKit.app" "dist/desktop/zak-desktop-$VERSION-arm64.zip"
          cp "$bundle/dmg/zAgentKit_${VERSION}_aarch64.dmg" "dist/desktop/zak-desktop-$VERSION-arm64.dmg"
          bash scripts/ci/verify-desktop-bundle.sh "$VERSION" "$bundle/macos/zAgentKit.app" \
            "dist/desktop/zak-desktop-$VERSION-arm64.zip" "dist/desktop/zak-desktop-$VERSION-arm64.dmg"
      - name: Upload desktop assets
        run: |
          set -eu
          gh release upload "$TAG" "dist/desktop/zak-desktop-$VERSION-arm64.dmg" \
            "dist/desktop/zak-desktop-$VERSION-arm64.zip"
          mkdir read-back
          gh release download "$TAG" --dir read-back --pattern 'zak-desktop-*'
          cmp "dist/desktop/zak-desktop-$VERSION-arm64.dmg" "read-back/zak-desktop-$VERSION-arm64.dmg"
          cmp "dist/desktop/zak-desktop-$VERSION-arm64.zip" "read-back/zak-desktop-$VERSION-arm64.zip"
      - name: Keep ZIP for the Homebrew cask
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zak-desktop-zip
          path: dist/desktop/zak-desktop-*-arm64.zip
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [release, desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish release
        run: |
          set -eu
          latest='--latest'
          case "$TAG" in
            *-beta.*) latest='--latest=false';;
          esac
          gh release edit "$TAG" --draft=false $latest
  homebrew:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zak-desktop-zip
          path: dist/desktop
      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          bash scripts/ci/bump-homebrew-cask.sh "$version" "dist/desktop/zak-desktop-${version}-arm64.zip"
